<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HamSpot Settings</title><style>
:root{font-family:system-ui,Arial;color:#edf6ff;background:#0b1622}*{box-sizing:border-box}body{margin:0}header{padding:18px 4%;background:#14283c;border-bottom:1px solid #365570}h1{margin:0}small{color:#b2cbde}.layout{display:grid;grid-template-columns:235px 1fr;min-height:85vh}nav{background:#132439;padding:16px}nav button{display:block;width:100%;text-align:left;background:transparent;color:#dcefff;border:0;padding:12px;border-radius:9px;cursor:pointer}nav button[aria-selected=true]{background:#295373}main{padding:25px;max-width:1050px}.field{margin:15px 0;display:flex;flex-direction:column;gap:5px}input,select{background:#0c1d2d;color:white;border:1px solid #54728b;border-radius:7px;padding:11px;max-width:450px}label{color:#bbd7eb}.notice{background:#43381c;padding:13px;border-radius:8px;color:#ffdda0}.action{background:#225c77;color:#fff;border:0;padding:12px 20px;border-radius:8px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#11283b;padding:15px;border-radius:9px}a{color:#9ad9ff}@media(max-width:750px){.layout{grid-template-columns:1fr}nav{display:flex;overflow:auto}nav button{min-width:140px}main{padding:16px}}
</style></head><body><header><h1>HamSpot Settings</h1><small>Original menu-driven configuration preview</small></header><div class="layout"><nav id="nav"></nav><main><div class="notice">Prototype only: changes are previewed in your browser and are NOT saved to the Raspberry Pi or applied to services.</div><h2 id="title"></h2><div id="fields"></div><button class="action" id="review">Review Settings</button><pre id="preview" hidden></pre><p><a href="/">Dashboard</a> · <a href="/hdmi.html">HDMI preview</a></p></main></div>
<script>
const menus=[
{name:'General',fields:[['Callsign','text','N0CALL'],['DMR ID','text',''],['Hostname','text','hamspot'],['Time zone','text','America/Chicago'],['Location','text','']]},
{name:'Radio & MMDVM',fields:[['Modem type','select','MMDVM_HS Hat|ZUMspot|USB MMDVM|Other'],['Controller','select','MMDVMHost|DStarRepeater'],['Node type','select','Simplex|Duplex'],['RX frequency (MHz)','number',''],['TX frequency (MHz)','number',''],['DMR','check','true'],['D-Star','check','true'],['YSF','check','false'],['P25','check','false'],['NXDN','check','false'],['M17','check','false']]},
{name:'DMR Networks',fields:[['DMR master','text',''],['Master port UDP','number','62031'],['DMRGateway','check','true'],['XLX reflector','text','XLX480'],['XLX port UDP','number','62030'],['Talkgroup','number','4005'],['Module','text','E']]},
{name:'D-Star',fields:[['Gateway','text',''],['Default reflector','text',''],['Module','text','E'],['Auto reconnect','check','true']]},
{name:'Cross-Mode',fields:[['D-Star to DMR bridge','check','false'],['Vocoder backend','select','None|External AMBE hardware|Future verified software backend'],['DMR talkgroup','number','4005']]},
{name:'Firewall & Ports',fields:[['Firewall enabled','check','false'],['DMR UDP','number','62030'],['Alternate XLX UDP','number','62040'],['Web admin port','number','8080'],['Remote admin access','check','false']]},
{name:'HDMI & Nextion',fields:[['HDMI 0','select','Nextion-style|Dashboard|Off'],['HDMI 1','select','Dashboard|Nextion-style|Mirror HDMI 0|Off'],['Physical Nextion','check','false'],['Nextion serial port','select','/dev/serial0|/dev/ttyUSB0|Modem'],['Baud rate','select','9600|115200']]},
{name:'Network',fields:[['Ethernet DHCP','check','true'],['Wi-Fi SSID','text',''],['Wi-Fi password','password',''],['mDNS hostname','text','hamspot.local']]},
{name:'Advanced',fields:[['RF hangtime (s)','number','2'],['Network hangtime (s)','number','2'],['Debug logging','check','false']]},
{name:'Maintenance',fields:[['Update channel','select','Stable|Testing'],['Automatic backups','check','true']]}
];
const nav=document.getElementById('nav'), fields=document.getElementById('fields'),title=document.getElementById('title'),preview=document.getElementById('preview');let current=0;
function show(n){current=n;nav.querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-selected',String(i===n)));title.textContent=menus[n].name;fields.replaceChildren();preview.hidden=true;menus[n].fields.forEach(([name,type,value],i)=>{const wrap=document.createElement('div');wrap.className='field';const label=document.createElement('label');label.textContent=name;label.htmlFor='f'+i;let input;if(type==='select'){input=document.createElement('select');value.split('|').forEach(v=>{const o=document.createElement('option');o.textContent=v;input.append(o)})}else{input=document.createElement('input');input.type=type==='check'?'checkbox':type;input.value=type==='check'?'':value;if(type==='check')input.checked=value==='true';if(type==='number')input.min='0'}input.id='f'+i;wrap.append(label,input);fields.append(wrap)})}
menus.forEach((m,i)=>{const b=document.createElement('button');b.textContent=m.name;b.onclick=()=>show(i);nav.append(b)});
document.getElementById('review').onclick=()=>{const result={};menus[current].fields.forEach(([name,type],i)=>{const el=document.getElementById('f'+i);result[name]=type==='password'?'[redacted]':type==='check'?el.checked:el.value});preview.textContent=JSON.stringify(result,null,2)+'\n\nPREVIEW ONLY — not applied';preview.hidden=false};show(0);
</script></body></html>
