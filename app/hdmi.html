<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HamSpot HDMI</title><style>
*{box-sizing:border-box}body{margin:0;background:#050a12;color:#fff;font-family:Arial,system-ui,sans-serif}main{padding:3vw;max-width:1800px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #2a608d;padding-bottom:2vw}h1{font-size:clamp(28px,4vw,76px);margin:0;color:#74c2ff}.badge{background:#184b45;color:#86e9ca;border-radius:12px;padding:1vw;font-size:clamp(14px,1.5vw,26px)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:2vw;margin-top:2vw}.card{background:#102c45;border:2px solid #24577f;border-radius:15px;padding:2vw;min-height:18vh}.label{font-size:clamp(16px,2vw,30px);color:#9dd4ff}.value{font-size:clamp(32px,6vw,110px);font-weight:bold;margin-top:1vw}.foot{margin-top:2vw;background:#122b3f;border-radius:12px;padding:2vw;font-size:clamp(16px,2vw,34px)}.demo{color:#f0c986}</style></head><body><main><header><h1>HamSpot</h1><span class="badge">HAMSPOT STATUS</span></header><div class="grid"><div class="card"><div class="label">MODE</div><div class="value" id="mode">—</div></div><div class="card"><div class="label">REFLECTOR</div><div class="value" id="reflector">—</div></div><div class="card"><div class="label">CALLSIGN</div><div class="value" id="callsign">—</div></div><div class="card"><div class="label">TALKGROUP</div><div class="value" id="talkgroup">—</div></div></div><div class="foot">Live status · Browser view; HDMI kiosk and physical Nextion driver not installed</div></main><script>async function update(){try{const r=await fetch('/api/status',{cache:'no-store'});const d=await r.json();for(const k of ['mode','reflector','callsign','talkgroup'])document.getElementById(k).textContent=d[k]}catch(e){document.querySelector('.foot').textContent='Status service offline'}}update();setInterval(update,3000)</script></body></html>
