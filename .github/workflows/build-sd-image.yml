name: Build HamSpot SD Image (DMR Integration Test)

on:
  workflow_dispatch:
  push:
    branches: ["image/dmr-integration"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 330
    steps:
      - name: Get HamSpot source
        uses: actions/checkout@v4
      - name: Test configuration and API
        run: python3 -m unittest discover -s tests -v
      - name: Prepare pi-gen custom stage
        shell: bash
        run: |
          set -euo pipefail
          bash image/prepare-stage.sh image/stage-hamspot
      - name: Build Raspberry Pi OS image
        id: image
        uses: usimd/pi-gen-action@v1
        with:
          image-name: HamSpot-arm64-dmr-test
          pi-gen-version: arm64
          release: trixie
          stage-list: stage0 stage1 stage2 ./image/stage-hamspot
          export-last-stage-only: true
          hostname: hamspot
          timezone: America/Chicago
          keyboard-keymap: us
          keyboard-layout: English (US)
          compression: xz
          enable-cloud-init: 0
          enable-ssh: 0
          increase-runner-disk-size: false
      - name: Publish downloadable image
        uses: actions/upload-artifact@v4
        with:
          name: HamSpot-arm64-dmr-test-SD-image
          path: ${{ steps.image.outputs.image-path }}
          if-no-files-found: error
          retention-days: 14
